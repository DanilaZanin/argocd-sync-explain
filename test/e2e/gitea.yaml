apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: git
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.24
          imagePullPolicy: IfNotPresent
          env:
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__HTTP_PORT, value: "3000"}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.git.svc.cluster.local:3000/"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__log__LEVEL, value: Warn}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: git
spec:
  selector: {app: gitea}
  ports:
    - port: 3000
      targetPort: 3000
